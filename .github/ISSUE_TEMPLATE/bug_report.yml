name: 故障反馈 / Bug report
description: 提供版本、安装范围和复现步骤，帮助定位问题。
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "请勿提交 API Key、认证 token、个人配置或未脱敏的对话记录。"
  - type: dropdown
    id: bundle
    attributes:
      label: 安装范围 / Bundle
      options:
        - 美化包 / Beauty
        - 功能扩展包 / Extensions
        - 完整套装 / Full
        - 单个插件 / Single plugin
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 系统、DSH 和插件版本 / Versions
      placeholder: "Windows / DSH Desktop 0.12.0 / Harness 0.2.0-rc.2 / suite-v1.3.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 描述触发操作、预期结果与实际结果。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的错误信息或截图 / Redacted evidence
      description: 仅提供定位所需片段，先移除密钥和私人内容。
